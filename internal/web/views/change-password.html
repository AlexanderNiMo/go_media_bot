{{define "content"}}
<h1>Смена пароля</h1>
<p>Перед использованием веб-интерфейса замените временный пароль своим.</p>
<form method="post" action="{{path .BasePath "/change-password"}}" class="stack narrow">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <label>Новый пароль
    <input type="password" name="password" autocomplete="new-password" required minlength="10">
  </label>
  <button type="submit">Сменить пароль</button>
</form>
{{end}}
