{{define "content"}}
<h1>Все запросы</h1>

<form method="get" action="{{path .BasePath "/requests"}}" class="filters">
  <label>Состояние
    <select name="state" onchange="this.form.submit()">
      <option value="" {{if not .State}}selected{{end}}>активные</option>
      <option value="all" {{if eq .State "all"}}selected{{end}}>все</option>
      {{range .States}}
        <option value="{{.}}" {{if eq $.State .}}selected{{end}}>{{stateLabel .}}</option>
      {{end}}
    </select>
  </label>
  <noscript><button type="submit">Показать</button></noscript>
</form>

{{if .Requests}}
  <table role="table" class="table-cards">
    <thead>
      <tr role="row"><th role="columnheader">ID</th><th role="columnheader">Что</th><th role="columnheader">Состояние</th><th role="columnheader">Когда</th><th role="columnheader">Кто смотрит</th></tr>
    </thead>
    <tbody>
    {{range .Requests}}
      <tr role="row">
        <td role="cell" data-label="ID" class="muted">{{.ID}}</td>
        <td role="cell" data-label="Что"><a href="{{path $.BasePath "/requests/"}}{{.ID}}">{{.Title}}</a></td>
        <td role="cell" data-label="Состояние"><span class="state {{stateClass .State}}">{{stateLabel .State}}</span></td>
        <td role="cell" data-label="Когда" class="muted">{{.When}}</td>
        <td role="cell" data-label="Кто смотрит" class="muted">{{.Watchers}}</td>
      </tr>
    {{end}}
    </tbody>
  </table>
{{else}}
  <p class="muted">Ничего нет.</p>
{{end}}
{{end}}
