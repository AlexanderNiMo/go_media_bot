# Infrastructure for mediad: PostgreSQL and a self-hosted Temporal server.
#
# Version pins matter here. `temporalio/auto-setup`, which used to create the
# schema for you, is deprecated and the temporalio/docker-compose repository
# that shipped it was archived in January 2026; schema creation is now a
# one-shot admin-tools container (see temporal-schema-setup below). Any guide
# using auto-setup is stale.
#
# Ports that cross the container boundary:
#   7233  Temporal frontend gRPC — the only one the application needs
#   8233  Temporal Web UI
#   5432  PostgreSQL, published on loopback only, for psql and dumps
#
# Ports 6933/6934/6935/6939 are internode membership (ringpop). They are never
# published: the four Temporal services run in one process here and talk to
# themselves.

name: mediad

# A single named network rather than the implicit default so the wiring is
# visible in the file. Every service is on it explicitly — service-to-service
# DNS resolution goes through the same Compose-managed bridge either way, but
# listing the attachment makes the dependency graph auditable.
networks:
  mediad:
    name: mediad

services:
  postgresql:
    image: postgres:16
    container_name: mediad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # PGDATA points at a SUBDIRECTORY, and that is load-bearing rather than
      # cosmetic.
      #
      # The image runs initdb into PGDATA on first start, and refuses to
      # proceed if the directory is not empty:
      #   directory "/var/lib/postgresql/data" exists but is not empty
      # A directory bind-mounted from the host is almost never empty — a
      # .DS_Store on macOS, lost+found when mounting the root of an ext4 disk,
      # or just a file someone left there. Naming a subdirectory lets Postgres
      # create it itself, so whatever is in the mount point stops mattering.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # A local directory rather than a named volume, so the data is visible,
      # rsync-able, and survives `docker compose down -v`.
      #
      # Two consequences to know about. On Linux the directory must be owned by
      # uid 999 (the postgres user in the image): sudo chown -R 999:999 ./data/postgres
      # And this must be a LOCAL disk: Postgres relies on locking and fsync
      # semantics that NFS and SMB do not guarantee, and the failure mode is
      # silent corruption rather than a startup error.
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - mediad

  # Creates both Temporal databases and brings their schema up to date.
  #
  # A separate one-shot container rather than part of the server's entrypoint
  # because upgrading Temporal is then a two-line change: bump the admin-tools
  # tag, let this run, then bump the server tag. Schema first, always.
  temporal-schema-setup:
    image: temporalio/admin-tools:1.31.0
    container_name: mediad-temporal-schema
    restart: on-failure:10
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # temporal-sql-tool reads SQL_USER and SQL_PASSWORD, not POSTGRES_*.
      # Both pairs are set because the two tools read different names.
      SQL_USER: ${POSTGRES_USER:-temporal}
      SQL_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    # $$VAR, not ${VAR}: a single dollar would be substituted by Compose from
    # the host environment and blanked out, because these are meant for the
    # shell inside the container.
    command:
      - |
        set -eu
        echo "waiting for postgres at $$POSTGRES_SEEDS:$$DB_PORT"
        until nc -z -w 5 "$$POSTGRES_SEEDS" "$$DB_PORT"; do sleep 2; done

        for DB in temporal temporal_visibility; do
          temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" \
            -u "$$SQL_USER" -p "$$DB_PORT" --db "$$DB" create || true
          temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" \
            -u "$$SQL_USER" -p "$$DB_PORT" --db "$$DB" setup-schema -v 0.0 || true
        done

        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" \
          -u "$$SQL_USER" -p "$$DB_PORT" --db temporal \
          update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned

        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" \
          -u "$$SQL_USER" -p "$$DB_PORT" --db temporal_visibility \
          update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

        echo "temporal schema is up to date"
    networks:
      - mediad

  temporal:
    image: temporalio/server:1.31.0
    container_name: mediad-temporal
    restart: unless-stopped
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      # Required. The config template binds to 127.0.0.1 by default, which
      # means nothing outside this container can reach 7233.
      BIND_ON_IP: 0.0.0.0

      # Immutable once the server has started against a database: changing it
      # later is unsupported. 4 is the default and is far more than this
      # workload needs, but it is pinned here so the value lives in git.
      NUM_HISTORY_SHARDS: "4"

      # The defaults are 20 and 10 PER SERVICE, and all four services share
      # this process — against Postgres's own max_connections of 100 that is a
      # restart storm waiting to happen.
      SQL_MAX_CONNS: "8"
      SQL_VIS_MAX_CONNS: "8"

      LOG_LEVEL: info
      # Caps the history cache. Without this the history service grows its
      # mutable-state cache toward the built-in budget of ~1 GiB, which is the
      # difference between a 300 MB container and a 1.3 GB one.
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/home-lab.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    networks:
      - mediad

  # Creates the namespace. `default` is only created automatically by the CLI
  # dev server; with a real server every namespace is explicit.
  #
  # Why a separate Dockerfile under scripts/ rather than an inline command
  # in this file: the script has grown past what is comfortable to read
  # between YAML keys, and a regression test or manual run is easier when
  # the script is its own file. Alpine + the official CLI installer, not
  # temporalio/admin-tools:1.31.0 — admin-tools' bundled CLI hits a gRPC
  # deadline against the matching server image pair (TCP works, the gRPC
  # call never completes); the CLI binary fetched by
  # https://temporal.download/cli.sh works.
  #
  # If this does not work end-to-end (the gRPC call from inside the bridge to
  # the temporal container has been seen to time out), fall back to
  # `network_mode: "host"` with `TEMPORAL_ADDRESS: localhost:7233` — the CLI
  # works on the host network, the bridge is the trouble. The Dockerfile path
  # is preferred when possible because it does not leak the container out of
  # the project's network.
  #
  # build.context is the repo root (not the script's directory) because the
  # Dockerfile needs go.mod / go.sum from the parent for the Temporal SDK
  # dependencies. The script source itself lives one level down and is
  # copied explicitly.
  temporal-namespace-setup:
    build:
      context: .
      dockerfile: scripts/temporal-namespace-setup/Dockerfile
    container_name: mediad-temporal-namespace
    restart: on-failure:10
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-mediad}
    networks:
      - mediad

  temporal-ui:
    image: temporalio/ui:2.49.1
    container_name: mediad-temporal-ui
    restart: unless-stopped
    depends_on:
      # On the namespace, not merely on the server being healthy. The UI is
      # pointed at TEMPORAL_DEFAULT_NAMESPACE below, and a UI whose namespace
      # does not exist yet opens on an error — which is how a stack that is
      # still starting looks identical to one that is misconfigured.
      temporal-namespace-setup:
        condition: service_completed_successfully
      # Ordering, not a data dependency, and it is what makes a single target
      # sufficient: the UI is the last service of an infrastructure-only run,
      # so naming it in `up -d` has to wait for the other branch of the graph
      # as well. Without this, `docker compose up -d temporal-ui` starts
      # Temporal and silently leaves the application's database uncreated.
      #
      # On the migration rather than directly on db-setup: the migration
      # already depends on the database existing, so this one edge carries the
      # whole chain, and a database with no tables is not a stack that is up.
      mediad-migrate:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: "8080"
      TEMPORAL_DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-mediad}
      # Must match how you actually reach the UI, or the UI's own API calls
      # are blocked by CORS.
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8080"
    networks:
      - mediad

  # The application. Not started by `docker compose up` by default — run it
  # from the host with `make worker` / `make api` while developing, or bring it
  # up explicitly with `docker compose --profile app up -d`.
  #
  # network_mode: "host" — the same fix that namespace-setup needs. The
  # Docker bridge drops HTTP/2 SETTINGS frames between the application
  # container and the Temporal container in some configurations, and the
  # gRPC connection from `client.Dial` (in go.temporal.io/sdk) times out
  # with `context deadline exceeded` after 30 attempts (~60 s). On the host
  # network the same call completes in milliseconds. Trade-off: this
  # service is no longer on `mediad`, so it cannot reach other services by
  # name; PostgreSQL and Temporal are reached via `localhost:5432` and
  # `localhost:7233`, which compose's port mappings publish on the host.
  # `networks: [mediad]` below is dropped because compose rejects
  # `network_mode` + `networks` as mutually exclusive.
  mediad:
    build: .
    container_name: mediad-app
    profiles: ["app"]
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      # Depends on the namespace container, not on temporal being healthy:
      # "the server is up" and "the namespace exists" are different conditions,
      # and namespace registration takes up to 15 seconds.
      temporal-namespace-setup:
        condition: service_completed_successfully
      # And on its own database existing, with its schema applied. The
      # application migrates on startup too, but it cannot migrate a database
      # nobody has created yet — without this it starts, fails to connect, and
      # restarts until the setup container happens to win the race.
      mediad-migrate:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
    command: ["all", "--config", "/etc/mediad/config.yaml"]
    # Plex, qBittorrent and Prowlarr run on the host, not in this compose file.
    # With network_mode: "host" the container shares the host's network stack,
    # so `localhost` resolves to the host's loopback. host.docker.internal is
    # kept for compatibility with *_DOCKER URL variants that already target
    # the host gateway explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MEDIAD_POSTGRES_DSN: postgres://mediad:${MEDIAD_DB_PASSWORD:?set MEDIAD_DB_PASSWORD in .env}@localhost:5432/mediad?sslmode=disable
      # TEMPORAL
      MEDIAD_TEMPORAL_HOST: localhost:7233
      MEDIAD_TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-mediad}
      # TMDB
      MEDIAD_TMDB_API_KEY: ${MEDIAD_TMDB_API_KEY:-}
      MEDIAD_TMDB_PROXY: ${MEDIAD_TMDB_PROXY:-}
      # The *_DOCKER variants override the host-facing values from .env, which
      # are written for a process running on the host. Two names rather than a
      # rewrite of the URL because Compose does not do substitution inside a
      # value: there is no way to turn `localhost` into `host.docker.internal`
      # while leaving the port alone.
      # PLEX
      MEDIAD_PLEX_URL: ${PLEX_URL_DOCKER:-${PLEX_URL:-}}
      MEDIAD_PLEX_TOKEN: ${MEDIAD_PLEX_TOKEN:-}
      # INDEXER
      MEDIAD_INDEXER_BASE_URL: ${INDEXER_BASE_URL_DOCKER:-${INDEXER_BASE_URL:-}}
      MEDIAD_INDEXER_API_KEY: ${MEDIAD_INDEXER_API_KEY:-}
      # QBITTORRENT
      MEDIAD_QBITTORRENT_URL: ${QBITTORRENT_URL_DOCKER:-${MEDIAD_QBITTORRENT_URL:-}}
      MEDIAD_QBITTORRENT_API_KEY: ${MEDIAD_QBITTORRENT_API_KEY:-}
      MEDIAD_QBITTORRENT_USERNAME: ${MEDIAD_QBITTORRENT_USERNAME:-}
      MEDIAD_QBITTORRENT_PASSWORD: ${MEDIAD_QBITTORRENT_PASSWORD:-}
      # TELEGRAM
      MEDIAD_TELEGRAM_ENABLED: ${MEDIAD_TELEGRAM_ENABLED:-false}
      MEDIAD_TELEGRAM_TOKEN: ${MEDIAD_TELEGRAM_TOKEN:-}
      MEDIAD_TELEGRAM_PROXY: ${MEDIAD_TELEGRAM_PROXY:-}
      # APP_SERVER
      MEDIAD_SERVER_LISTEN: ${MEDIAD_SERVER_LISTEN:-0.0.0.0:8081}
      MEDIAD_SERVER_BASE_URL: ${MEDIAD_SERVER_BASE_URL:-localhost}
      MEDIAD_SERVER_BASE_PATH: ${MEDIAD_SERVER_BASE_PATH:-}
    # config.yaml is optional. The host's ./config.yaml (gitignored; see
    # config_dev.yaml.example for the template) is mounted read-only into
    # the container and passed to `mediad all` via --config. An empty file
    # is a no-op: the loader treats it as "no file-based overrides" and the
    # MEDIAD_* env vars layered on top still drive the configuration. The
    # Makefile target `up-all` touches the file if it does not exist so
    # the bind mount has a target.
    volumes:
      - ./config.yaml:/etc/mediad/config.yaml:ro
    # `ports:` is ignored under network_mode: "host" (compose binds the port
    # directly to the host), but kept for documentation. Same for
    # `expose:`.

  # Creates the application's own database. Runs once, before anything opens a
  # connection to it; migrations are applied by the application itself.
  mediad-db-setup:
    image: postgres:16
    container_name: mediad-db-setup
    restart: on-failure:10
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB: mediad
      APP_USER: mediad
      APP_PASSWORD: ${MEDIAD_DB_PASSWORD:?set MEDIAD_DB_PASSWORD in .env}
      SUPERUSER: ${POSTGRES_USER:-temporal}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        exists=$$(psql -h postgresql -U "$$SUPERUSER" -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = '$$APP_DB'")
        if [ "$$exists" = "1" ]; then
          echo "database $$APP_DB already exists"
        else
          psql -h postgresql -U "$$SUPERUSER" -d postgres -c \
            "CREATE DATABASE $$APP_DB"
          echo "database $$APP_DB created"
        fi

        psql -h postgresql -U "$$SUPERUSER" -d postgres -tAc \
          "SELECT 1 FROM pg_roles WHERE rolname = '$$APP_USER'" | grep -q 1 || \
          psql -h postgresql -U "$$SUPERUSER" -d postgres -c \
            "CREATE ROLE $$APP_USER LOGIN PASSWORD '$$APP_PASSWORD'"

        # The password is set on every run, not only at creation. A role that
        # already exists keeps whatever password it was made with, so changing
        # MEDIAD_DB_PASSWORD in .env would otherwise leave the application
        # failing to authenticate against a database that looks correctly
        # configured — and the error names the role, not the stale password.
        psql -h postgresql -U "$$SUPERUSER" -d postgres -c \
          "ALTER ROLE $$APP_USER PASSWORD '$$APP_PASSWORD'"

        # CREATEDB so the test suite can build throwaway databases instead of
        # running against the development one and truncating it.
        psql -h postgresql -U "$$SUPERUSER" -d postgres -c \
          "ALTER ROLE $$APP_USER CREATEDB"

        # The application owns its schema and nothing else. It is deliberately
        # not granted anything on the temporal databases.
        psql -h postgresql -U "$$SUPERUSER" -d postgres -c \
          "GRANT ALL PRIVILEGES ON DATABASE $$APP_DB TO $$APP_USER"
        psql -h postgresql -U "$$SUPERUSER" -d "$$APP_DB" -c \
          "GRANT ALL ON SCHEMA public TO $$APP_USER"
    networks:
      - mediad

  # Applies the application's own migrations, once, and exits.
  #
  # A container rather than a `make` step, because the tables are part of what
  # "the stack is up" means: a database with no schema is a stack that looks
  # started and fails on the first request. Being a service also puts it in the
  # dependency graph, so anything that needs the schema can say so instead of
  # hoping the ordering worked out.
  #
  # The application applies migrations on startup anyway, so this is not the
  # only path — it is the one that makes the schema exist before anything else
  # connects, including a worker run from the host.
  mediad-migrate:
    build: .
    container_name: mediad-migrate
    restart: on-failure:10
    depends_on:
      mediad-db-setup:
        condition: service_completed_successfully
    command: ["migrate", "--config", "/etc/mediad/config.yaml"]
    environment:
      MEDIAD_POSTGRES_DSN: postgres://mediad:${MEDIAD_DB_PASSWORD:?set MEDIAD_DB_PASSWORD in .env}@postgresql:5432/mediad?sslmode=disable
    volumes:
      - ./config.yaml:/etc/mediad/config.yaml:ro
    networks:
      - mediad
